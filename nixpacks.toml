[phases.setup]
nixPkgs = ['php83', 'nodejs']

[phases.install]
cmds = [
    'curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer',
    'PHP_BINARY=$(which php) php /usr/local/bin/composer install --no-dev --ignore-platform-reqs',
    'npm install --force',
    'npm install @rolldown/binding-linux-x64-gnu --force'
]

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT'
